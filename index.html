<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiauVibe - Portal Berita Riau dan Kepulauan Riau Terkini</title>
    
    <!-- Platform & SEO Metadata -->
    <meta name="siteName" content="RiauVibe" />
    <meta name="description" content="Portal berita terpercaya dan terkini menyajikan informasi seputar peristiwa, pemerintahan, ekonomi, olahraga, dan gaya hidup di Provinsi Riau dan Kepulauan Riau." />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        riau: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            800: '#173c66',
                            900: '#0f2b48',
                            950: '#0a1d33',
                            crimson: '#dc2626'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.5); }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>

                </span>

                <div class="flex items-center gap-2">

                    <i class="fas fa-feather-pointed text-[11px]"></i>
                    <span>Studio Redaksi & Iklan</span>
                </button>
                <button onclick="document.documentElement.classList.toggle('dark')" class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 transition-colors">

                </button>

            <a href="#" onclick="filterCategory('Semua'); return false;" class="flex items-center gap-3 group">

                <div class="w-12 h-12 rounded-xl bg-slate-900 dark:bg-slate-800 flex items-center justify-center shadow-md overflow-hidden border border-slate-200 dark:border-slate-700">
                    <img src="logo-riauvibe.png" alt="RiauVibe Logo" class="w-full h-full object-cover group-hover:scale-105 transition-transform" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100';">

                <div class="flex flex-col">

                    </h1>
                    <span class="text-xs font-semibold text-gray-500 dark:text-gray-400">Update Riau dan Kepulauan Riau</span>
