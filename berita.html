<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">RiauVibe - Detail Berita</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        riau: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            800: '#173c66',
                            900: '#0f2b48',
                            950: '#0a1d33',
                            crimson: '#dc2626'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 antialiased flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <header class="bg-white dark:bg-slate-900 shadow-sm border-b border-gray-100 dark:border-slate-800 sticky top-0 z-30">
        <div class="container mx-auto px-4 py-3.5 flex justify-between items-center">
            <a href="/" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-900 text-white flex items-center justify-center shadow-md">
                    <i class="fas fa-newspaper text-lg"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-blue-900 dark:text-blue-100">
                    Riau<span class="text-red-600">Vibe</span>
                </h1>
            </a>
            <a href="/" class="text-xs font-bold bg-blue-50 dark:bg-slate-800 text-blue-900 dark:text-blue-300 px-3 py-2 rounded-lg hover:bg-blue-100 transition-colors flex items-center gap-1.5">
                <i class="fas fa-arrow-left"></i> Kembali ke Beranda
            </a>
        </div>
    </header>

    <!-- Content Utama Berita -->
    <main class="container mx-auto px-4 py-8 flex-grow max-w-4xl">
        <div id="loadingState" class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-3xl text-blue-900 dark:text-blue-400 mb-3"></i>
            <p class="text-sm text-slate-500 font-medium">Memuat isi berita lengkap...</p>
        </div>

        <article id="articleContainer" class="hidden bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-800 p-6 md:p-10">
            <!-- Kategori & Judul -->
            <div class="mb-6">
                <span id="articleCategory" class="inline-block bg-blue-100 dark:bg-blue-900/50 text-blue-800 dark:text-blue-300 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-3">
                    Pemerintahan
                </span>
                <h1 id="articleTitle" class="text-2xl md:text-4xl font-extrabold text-slate-900 dark:text-white leading-tight">
                    Judul Berita
                </h1>
                <div class="flex items-center gap-4 text-xs text-slate-400 mt-4 pb-4 border-b border-slate-100 dark:border-slate-800">
                    <span id="articleDate"><i class="far fa-clock mr-1"></i> -</span>
                    <span><i class="far fa-user mr-1"></i> Redaksi RiauVibe</span>
                </div>
            </div>

            <!-- Foto Utama Berita -->
            <div id="articleImageWrapper" class="mb-8 rounded-xl overflow-hidden shadow-md">
                <img id="articleImage" src="" alt="" class="w-full h-auto max-h-[450px] object-cover" />
            </div>

            <!-- Isi Teks Artikel -->
            <div id="articleBody" class="prose dark:prose-invert max-w-none text-slate-700 dark:text-slate-200 text-base md:text-lg leading-relaxed space-y-4">
            </div>
        </article>

        <!-- Pesan Error Jika Slug Tidak Ditemukan -->
        <div id="errorState" class="hidden text-center py-16 bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800">
            <i class="fas fa-exclamation-circle text-4xl text-red-500 mb-3"></i>
            <h3 class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-2">Berita Tidak Ditemukan</h3>
            <p class="text-sm text-slate-500 mb-6">Artikel yang kamu cari tidak tersedia atau telah dihapus.</p>
            <a href="/" class="px-5 py-2.5 bg-blue-900 text-white font-bold text-xs rounded-xl hover:bg-blue-800 transition-colors">
                Kembali ke Beranda
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-300 border-t border-slate-800 mt-auto">
        <div class="container mx-auto px-4 py-6 text-center text-xs text-slate-500">
            &copy; 2026 RiauVibe - Portal Berita Riau dan Kepulauan Riau.
        </div>
    </footer>

    <!-- Script Fetch Detail Artikel Sanity -->
    <script>
      const PROJECT_ID = 'z0v67ol7';
      const DATASET = 'production';

      // Ambil parameter slug dari URL
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug');

      async function loadArticleDetail() {
        const loadingState = document.getElementById('loadingState');
        const articleContainer = document.getElementById('articleContainer');
        const errorState = document.getElementById('errorState');

        if (!slug) {
          loadingState.classList.add('hidden');
          errorState.classList.remove('hidden');
          return;
        }

        // Query GROQ Sanity berdasarkan Slug
        const query = encodeURIComponent(`*[_type == "post" && slug.current == "${slug}"][0]{
          title,
          category,
          publishedAt,
          "imageUrl": mainImage.asset->url,
          body
        }`);

        const endpoint = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${query}`;

        try {
          const response = await fetch(endpoint);
          const data = await response.json();
          const article = data.result;

          if (!article) {
            loadingState.classList.add('hidden');
            errorState.classList.remove('hidden');
            return;
          }

          // Render Data ke Elemen HTML
          document.getElementById('pageTitle').innerText = `${article.title} - RiauVibe`;
          document.getElementById('articleTitle').innerText = article.title;
          document.getElementById('articleCategory').innerText = article.category || 'Pemerintahan';
          document.getElementById('articleDate').innerHTML = `<i class="far fa-clock mr-1"></i> ${new Date(article.publishedAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}`;

          // Render Gambar
          if (article.imageUrl) {
            document.getElementById('articleImage').src = article.imageUrl;
            document.getElementById('articleImage').alt = article.title;
          } else {
            document.getElementById('articleImageWrapper').classList.add('hidden');
          }

          // Render Isi Teks Berita (Portable Text / Array Paragraf)
          const bodyContainer = document.getElementById('articleBody');
          if (Array.isArray(article.body)) {
            bodyContainer.innerHTML = article.body
              .map(block => {
                if (block._type === 'block' && block.children) {
                  const text = block.children.map(child => child.text).join('');
                  return `<p>${text}</p>`;
                }
                return '';
              })
              .join('');
          } else {
            bodyContainer.innerHTML = '<p>Isi berita telah dipublikasikan di Sanity CMS.</p>';
          }

          // Tampilkan Konten
          loadingState.classList.add('hidden');
          articleContainer.classList.remove('hidden');

        } catch (error) {
          console.error("Gagal memuat detail berita:", error);
          loadingState.classList.add('hidden');
          errorState.classList.remove('hidden');
        }
      }

      loadArticleDetail();
    </script>
</body>
</html>
